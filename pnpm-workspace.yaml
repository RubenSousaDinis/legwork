packages:
  - "packages/*"
  - "apps/*"
  - "subgraph"
  - "examples"

# Every dependency the build will ever need, declared once, here.
# Agents never edit a lockfile and never add a dependency: they raise
# `DEP REQUEST:` and the lead adds it to this catalog.
catalog:
  # -- language / tooling --
  typescript: ^5.7.2
  tsx: ^4.19.2
  vitest: ^2.1.8
  eslint: ^9.17.0
  typescript-eslint: ^8.18.1
  prettier: ^3.4.2
  "@types/node": ^22.10.2
  "@types/react": ^19.0.2
  "@types/react-dom": ^19.0.2

  # -- shared --
  zod: ^4.5.4
  viem: ^2.56.3
  jose: ^5.9.6
  ngeohash: ^0.6.4
  fastest-levenshtein: ^1.0.16
  fast-json-stable-stringify: ^2.1.0
  pino: ^9.5.0

  # -- web --
  next: ^16.3.4
  react: ^19.0.0
  react-dom: ^19.0.0
  tailwindcss: ^4.0.0
  "@tailwindcss/postcss": ^4.0.0

  # -- World --
  "@worldcoin/idkit": ^4.2.3
  "@worldcoin/idkit-core": ^4.2.4
  "@worldcoin/minikit-js": ^2.0.3

  # -- payments (x402 v2 scoped packages; the x402-* packages are deprecated) --
  "@x402/core": ^2.25.0
  "@x402/evm": ^2.25.0
  "@x402/fetch": ^2.25.0

  # -- MCP --
  mcp-handler: ^2.1.1
  "@modelcontextprotocol/sdk": ^1.30.0

  # -- Anthropic --
  "@anthropic-ai/sdk": ^0.123.0

  # -- data --
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  postgres: ^3.4.5
  "@electric-sql/pglite": ^0.5.8
  "@supabase/supabase-js": ^2.47.10

  # -- media --
  sharp: ^0.33.5
  exifr: ^7.1.3

  # -- test --
  msw: ^2.7.0
  "@playwright/test": ^1.49.1

  # -- subgraph --
  "@graphprotocol/graph-cli": ^0.98.1
  "@graphprotocol/graph-ts": ^0.38.2

  # -- docs --
  "@asteasolutions/zod-to-openapi": ^7.3.0
